name: Build (with prerender) and deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_A4auGQDlNUDVWPYclUD06BY1
  VERCEL_PROJECT_ID: prj_ZOA746QLnxbCcPvDT6aOvdHznpbQ
  # Active le pre-rendering Puppeteer dans vite.config.ts pour TOUTES les
  # commandes du job (npm run build ET vercel build qui appelle npm run build).
  PRERENDER: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Garde-fou : seul main part en production (workflow_dispatch depuis une autre branche compris).
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Barrière qualité : main ne se déploie plus avec des erreurs ESLint ou TypeScript.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel artifacts (with pre-rendering)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
